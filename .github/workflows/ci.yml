name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build -project Flapse.xcodeproj \
            -scheme Flapse \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -80
      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild analyze -project Flapse.xcodeproj \
            -scheme Flapse \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -80
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Flapse.xcodeproj \
            -scheme Flapse \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:FlapseTests \
            -skip-testing:FlapseTests/CaptureTogetherTests/test_paylasimKoku_paylasimKimligineGoreSecilir \
            -skip-testing:FlapseTests/CaptureTogetherTests/test_yanlisProjeyeKopyalananKareler_cloudIliskisineGoreTemizlenir \
            -skip-testing:FlapseTests/CaptureTogetherTests/test_yeniPaylasimlar_projeBasinaAyriZoneKullanir \
            -skip-testing:FlapseTests/ProjectRepositoryTests/test_ortakProjedeKaliciSilinenCekim_yenidenEsitlenmez | tail -120
      - name: Accessibility smoke tests
        run: |
          set -o pipefail
          xcodebuild test -project Flapse.xcodeproj \
            -scheme Flapse \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:FlapseUITests/FlapseUITests/testCoreScreensPassAccessibilityAudit \
            -only-testing:FlapseUITests/FlapseUITests/testCoreScreensRemainUsableAtLargestAccessibilityTextSize | tail -120
